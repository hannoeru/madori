<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madori dashboard — PROTOTYPE</title><style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--panel:#f8fafc;--green:#16a34a;--blue:#2563eb;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--panel);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,a{font:inherit}button{cursor:pointer}.note{background:#0f172a;color:#fff;text-align:center;padding:7px;font-size:12px}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:21px 12px}.brand{font-size:24px;font-weight:800;padding:0 10px 25px}.brand span{color:var(--green)}.menu a{display:block;color:#475569;text-decoration:none;padding:10px;border-radius:6px;margin:3px 0}.menu a.active{background:#dcfce7;color:#166534;font-weight:700}.user{position:fixed;bottom:18px;padding:10px;color:var(--muted);font-size:13px}.main{padding:30px;max-width:1380px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:27px;letter-spacing:-.03em}.sub{color:var(--muted);margin-top:3px}.primary{border:0;background:var(--green);color:#fff;border-radius:6px;padding:10px 14px;font-weight:700}.secondary{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 12px}.queue{border:1px solid #fcd34d;background:#fffbeb;border-radius:8px;padding:16px 18px;margin-bottom:18px}.queue h2{margin:0;font-size:17px;color:#92400e}.queue p{margin:4px 0 10px;color:#92400e}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 30px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.card b{display:block;font-size:29px}.card span{color:var(--muted);font-size:13px}.card.warn b{color:var(--amber)}.section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section h2{font-size:18px;margin:0}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--muted);font-weight:600;background:#f8fafc}th,td{padding:11px 9px;border-bottom:1px solid var(--line)}.badge{font-size:12px;border-radius:99px;padding:3px 8px;font-weight:700}.published{background:#dcfce7;color:#166534}.draft{background:#e0f2fe;color:#075985}.withdrawn{background:#f1f5f9;color:#475569}.due{color:#b45309;font-weight:700}.tools{display:flex;gap:8px;margin-bottom:16px}.input{border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:var(--muted);background:#fff;min-width:220px}.form-layout{display:grid;grid-template-columns:190px 1fr;gap:24px}.anchor{height:max-content;position:sticky;top:18px}.anchor a{display:block;padding:9px;text-decoration:none;color:var(--muted);border-left:2px solid var(--line)}.anchor a:first-child{color:var(--green);border-color:var(--green);font-weight:700}.form-section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}.form-section h2{font-size:19px;margin:0 0 2px}.help{color:var(--muted);font-size:13px;margin:0 0 17px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}.required:after{content:' 必填';color:var(--red);font-size:11px;margin-left:4px}.control{min-height:39px;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;color:#475569;background:#fff}.wide{grid-column:1/-1}.upload{border:2px dashed #cbd5e1;border-radius:7px;padding:22px;text-align:center;color:var(--muted);margin-top:10px}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.media{height:105px;border-radius:6px;background:linear-gradient(135deg,#d1fae5,#86efac);position:relative;padding:7px;color:#166534;font-size:12px}.media.plan{background:linear-gradient(135deg,#e0f2fe,#93c5fd);color:#1d4ed8}.cover{position:absolute;bottom:5px;left:5px;background:#fff;border-radius:3px;padding:2px 5px}.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.actions{display:flex;gap:8px}.publish{background:var(--green);border:0;color:#fff;border-radius:6px;padding:10px 13px;font-weight:700}.preview{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px}.summary{border:1px solid #fca5a5;background:#fef2f2;color:#991b1b;border-radius:7px;padding:13px;margin:16px 0}.summary b{display:block}.switch{position:fixed;z-index:3;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#0f172a;padding:6px;border-radius:10px;box-shadow:0 8px 20px #0004}.switch a{color:#cbd5e1;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:13px}.switch a.active{color:#0f172a;background:#fff}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:19px 14px 90px}.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:1/-1}.tools{flex-wrap:wrap}.input{width:100%;min-width:auto}.section{overflow:auto}.form-layout{display:block}.anchor{display:none}.fields{grid-template-columns:1fr}.media-grid{grid-template-columns:repeat(2,1fr)}.editor-head{align-items:start;gap:10px}.actions{flex-wrap:wrap;justify-content:end}.top{align-items:start}.top .primary{white-space:nowrap}}
</style></head><body><div class="note">PROTOTYPE — throwaway dashboard discussion artifact. Nuxt UI default theme; Nuxt Dashboard Template is the layout reference.</div><div class="shell"><aside class="side"><div class="brand">ma<span>dori</span></div><nav class="menu"><a class="active">總覽</a><a>所有物件</a><a>新增物件</a><a>已撤下物件</a></nav><div class="user">Access 已保護<br>管理員</div></aside><main class="main" id="app"></main></div><nav class="switch"><a href="?screen=queue" data-screen="queue">新鮮度佇列</a><a href="?screen=list" data-screen="list">物件清單</a><a href="?screen=editor" data-screen="editor">分區表單</a></nav><script>
const row=(n,t,s,d)=>`<tr><td><b>${n}</b><br><small style="color:#64748b">R5471700 · 台東區</small></td><td><span class="badge ${s}">${t}</span></td><td class="${d?'due':''}">${d||'2026年9月18日'}</td><td><button class="secondary">編輯</button></td></tr>`;
const queue=`<header class="top"><div><h1>總覽</h1><div class="sub">早安，以下物件需要你的確認。</div></div><button class="primary" onclick="location='?screen=editor'">＋ 新增物件</button></header><section class="queue"><h2>2 件物件需要更新</h2><p>更新日期已到或即將到。請確認資料後更新、撤下或維持發布。</p><button class="secondary" onclick="location='?screen=list'">查看新鮮度佇列</button></section><section class="cards"><div class="card"><b>18</b><span>已發布物件</span></div><div class="card warn"><b>2</b><span>待更新物件</span></div><div class="card"><b>4</b><span>草稿物件</span></div></section><section class="section"><div class="section-head"><h2>新鮮度佇列</h2><button class="secondary">查看全部</button></div><table><thead><tr><th>物件</th><th>狀態</th><th>更新日期</th><th></th></tr></thead><tbody>${row('淺草站步行3分鐘・採光1LDK','已發布','published','已逾期 2 天')}${row('上野公園旁・翻新2LDK','已發布','published','明天')}${row('藏前・安靜巷弄的角間','草稿','draft','')}</tbody></table></section>`;
const list=`<header class="top"><div><h1>所有物件</h1><div class="sub">搜尋、篩選並管理每筆物件。</div></div><button class="primary" onclick="location='?screen=editor'">＋ 新增物件</button></header><div class="tools"><div class="input">搜尋物件編號或標題</div><button class="secondary">狀態：全部</button><button class="secondary">類型：全部</button><button class="secondary">區域：全部</button><button class="secondary">新鮮度：全部</button></div><section class="section"><table><thead><tr><th>物件</th><th>狀態</th><th>更新日期</th><th>操作</th></tr></thead><tbody>${row('淺草站步行3分鐘・採光1LDK','已發布','published','已逾期 2 天')}${row('上野公園旁・翻新2LDK','已發布','published','明天')}${row('藏前・安靜巷弄的角間','草稿','draft','')}${row('根津・安靜獨棟住宅','已撤下','withdrawn','')}</tbody></table></section>`;
const editor=`<div class="editor-head"><div><div style="color:#64748b;font-size:14px">所有物件 / 新增物件</div><h1 style="margin:2px 0">新增物件</h1></div><div class="actions"><button class="preview">預覽買家頁面</button><button class="secondary">儲存草稿</button><button class="publish">發布物件</button></div></div><div class="summary"><b>發布前請完成 3 個項目</b>所在地完整地址、下一次更新日期、至少一張物件照片。</div><div class="form-layout"><nav class="anchor"><a>基本資料</a><a>地點與交通</a><a>物件詳細資料</a><a>媒體</a><a>交易條件</a><a>發布設定</a></nav><div><section class="form-section"><h2>基本資料</h2><p class="help">買家可見的所有內容都以繁體中文輸入與確認。</p><div class="fields"><div class="field"><label class="required">物件編號</label><div class="control">R5471700</div></div><div class="field"><label class="required">物件類型</label><div class="control">中古公寓</div></div><div class="field wide"><label class="required">物件標題</label><div class="control">淺草站步行3分鐘・採光1LDK</div></div><div class="field"><label class="required">價格</label><div class="control">45,800,000 日圓</div></div><div class="field"><label class="required">下一次更新日期</label><div class="control">2026/09/06</div></div></div></section><section class="form-section"><h2>地點與交通</h2><p class="help">完整地址和至少一筆車站、路線、步行時間資料均為必填。</p><div class="fields"><div class="field wide"><label class="required">完整地址</label><div class="control">東京都台東區淺草1丁目</div></div><div class="field"><label class="required">車站</label><div class="control">淺草站</div></div><div class="field"><label class="required">步行時間</label><div class="control">3 分鐘</div></div></div></section><section class="form-section"><h2>媒體</h2><p class="help">發布前需要一張平面圖和 1–20 張物件照片。拖曳排序；選擇一張作為封面。</p><div class="media-grid"><div class="media plan">平面圖<div class="cover">必要</div></div><div class="media">物件照片<div class="cover">封面</div></div><div class="media">物件照片</div><div class="media">物件照片</div></div><div class="upload">拖曳檔案到此處，或選擇檔案</div></section><section class="form-section"><h2>發布設定</h2><p class="help">只有通過所有驗證的完整物件才能發布。</p><button class="publish">發布物件</button> <button class="secondary" style="color:#b45309">撤下物件</button> <button class="secondary" style="color:#dc2626">永久刪除</button></section></div></div>`;
const screen=new URLSearchParams(location.search).get('screen')||'queue';document.querySelector('[data-screen="'+screen+'"]').classList.add('active');document.querySelector('#app').innerHTML=({queue,list,editor})[screen];
</script></body></html>
