<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Madori buyer experience — PROTOTYPE</title>
  <style>
    :root { --ink:#0f172a; --teal:#16a34a; --sky:#2563eb; --mist:#f8fafc; --line:#e2e8f0; --paper:#fff; --muted:#64748b; }
    * { box-sizing:border-box } body { margin:0; color:var(--ink); background:var(--mist); font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    button,a { font:inherit } button { cursor:pointer } .prototype-note { background:#123d3a;color:#fff;padding:8px 16px;text-align:center;font-size:13px }
    header { height:72px; display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:auto;padding:0 24px } .brand { font-size:27px;font-weight:800;letter-spacing:-1px }.brand span{color:var(--teal)}
    .nav {display:flex;gap:24px;align-items:center;color:var(--muted);font-size:14px}.admin{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}
    main{max-width:1180px;margin:auto;padding:20px 24px 116px}.eyebrow{color:var(--teal);font-weight:750;font-size:13px;letter-spacing:.06em}.hero{padding:72px 0 42px;max-width:760px}.hero h1{font-size:clamp(40px,7vw,74px);line-height:1.06;letter-spacing:-.05em;margin:8px 0 18px}.hero p{font-size:19px;color:var(--muted);max-width:610px}
    .search-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 14px 36px #0f766e12;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px}.field{padding:10px 12px;border:1px solid #cddedc;border-radius:8px;background:#fff;color:var(--muted);font-size:14px}.field b{display:block;color:var(--ink);font-size:12px}.search{border:0;border-radius:8px;padding:0 20px;background:var(--sky);color:white;font-weight:700}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:58px 0 18px}.section-head h2{font-size:28px;margin:0;letter-spacing:-.03em}.section-head span{color:var(--muted);font-size:14px}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.trust div{padding:20px;border-top:3px solid var(--teal);background:#fff}.trust b{display:block;margin-bottom:5px}.trust small{color:var(--muted)}
    .results-layout{display:grid;grid-template-columns:255px 1fr;gap:28px}.filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;height:max-content}.filters h2{font-size:16px;margin:0 0 15px}.filter{padding:14px 0;border-top:1px solid #dcebea;font-size:14px}.filter b{display:block;margin-bottom:8px}.filter span{display:block;color:var(--muted);padding:4px 0}.result-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.result-title h1{font-size:25px;margin:0}.filter-button{display:none}.listing-row{display:grid;grid-template-columns:228px 1fr;gap:18px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}.photo{background:linear-gradient(135deg,#d5eeeb,#78b9b3);min-height:158px;border-radius:9px;position:relative;overflow:hidden}.photo:after{content:"MADORI";position:absolute;right:10px;bottom:7px;color:#ffffffaa;font-size:12px;font-weight:800}.tag{display:inline-block;background:#e0f5f1;color:#086259;padding:3px 7px;border-radius:4px;font-size:12px;font-weight:700}.listing-row h2{margin:7px 0 5px;font-size:20px;letter-spacing:-.02em}.price{font-size:24px;font-weight:800}.facts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:8px 0}.station{font-size:14px}.pager{display:flex;gap:7px;margin-top:24px}.pager button{background:white;border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--ink)}
    .crumb{color:var(--muted);font-size:14px;margin:4px 0 18px}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 325px;gap:32px}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px}.gallery .photo{min-height:330px}.gallery aside{display:grid;gap:8px}.gallery aside .photo{min-height:0}.detail h1{font-size:32px;line-height:1.2;margin:8px 0}.detail .price{font-size:34px}.summary{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin:22px 0}.summary div{padding:15px 8px}.summary b{display:block;font-size:13px;color:var(--muted)}.fact-group{margin:34px 0}.fact-group h2{font-size:20px;margin-bottom:10px}.fact-table{width:100%;border-collapse:collapse;background:white}.fact-table th,.fact-table td{padding:10px 12px;border:1px solid #d9e8e6;text-align:left;font-size:14px}.fact-table th{width:31%;background:#f5fbfa;font-weight:650}.contact-card{position:sticky;top:18px;background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.contact-card h2{font-size:20px;margin:0 0 5px}.contact-card p{color:var(--muted);font-size:14px}.line{display:block;text-align:center;background:#06c755;color:#fff;padding:14px;border-radius:8px;text-decoration:none;font-weight:800;margin-top:18px}.prototype-switch{position:fixed;z-index:5;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#123d3a;color:white;border-radius:12px;padding:6px;box-shadow:0 8px 24px #0004}.prototype-switch a{color:#d7efec;text-decoration:none;padding:8px 11px;border-radius:8px;font-size:13px}.prototype-switch a.active{background:#fff;color:#123d3a}
    @media(max-width:720px){header{height:60px;padding:0 16px}.nav a{display:none}main{padding:10px 16px 106px}.hero{padding:36px 0 26px}.hero h1{font-size:43px}.search-panel{grid-template-columns:1fr 1fr;padding:12px}.search{height:44px;grid-column:1/-1}.trust{grid-template-columns:1fr}.results-layout{display:block}.filters{display:none}.filter-button{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px}.listing-row{grid-template-columns:120px 1fr;gap:12px}.photo{min-height:106px}.listing-row h2{font-size:16px}.price{font-size:19px}.facts{gap:7px}.detail-grid{display:block}.gallery{margin-inline:-16px;grid-template-columns:1fr}.gallery .photo{min-height:270px}.gallery aside{display:none}.detail h1{font-size:27px}.summary{grid-template-columns:1fr 1fr}.contact-card{display:none}.mobile-contact{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:#fff;border-top:1px solid var(--line);z-index:4}.mobile-contact .line{margin:0;padding:12px}.prototype-switch{bottom:62px}.detail .price{font-size:29px}}
  </style>
</head>
<body>
  <div class="prototype-note">PROTOTYPE — throwaway buyer-experience discussion artifact. Nuxt UI default theme direction; switch screens below.</div>
  <header><div class="brand">ma<span>dori</span></div><nav class="nav"><a>物件搜尋</a><a>東京23區指南</a><button class="admin">管理員登入</button></nav></header>
  <main id="app"></main>
  <nav class="prototype-switch"><a href="?screen=home" data-screen="home">搜尋首頁</a><a href="?screen=results" data-screen="results">緊湊結果</a><a href="?screen=detail" data-screen="detail">物件詳情</a></nav>
  <script>
    const row=(name,price,area,station)=>`<a class="listing-row" href="?screen=detail"><div class="photo"></div><div><span class="tag">中古公寓</span><h2>${name}</h2><div class="price">${price}</div><div class="facts"><span>1LDK</span><span>43.05m²</span><span>1983年1月</span></div><div class="station">銀座線「${station}」站 步行3分鐘</div><div class="station">台東區・完整地址公開</div></div></a>`;
    const home=`<section class="hero"><div class="eyebrow">TOKYO 23 WARDS · HOME BUYING</div><h1>找到在東京，真正適合你的家。</h1><p>以地區、預算、格局與車站搜尋；每筆物件都有完整、可比較的繁體中文資訊。</p></section><section class="search-panel"><div class="field"><b>地區</b>選擇區域或車站</div><div class="field"><b>預算</b>任何價格</div><div class="field"><b>物件條件</b>公寓、獨棟、格局</div><button class="search" onclick="location='?screen=results'">搜尋物件</button></section><section class="section-head"><h2>為什麼使用 Madori</h2></section><section class="trust"><div><b>完整物件資訊</b><small>發布前確認所有適用的物件資料。</small></div><div><b>繁體中文閱讀</b><small>以清楚的繁中標籤理解日本房產。</small></div><div><b>直接 LINE 諮詢</b><small>找到心儀物件後，立即開始對話。</small></div></section><section class="section-head"><h2>精選物件</h2><span>查看全部 →</span></section>${row('淺草站步行3分鐘・採光1LDK','4,580萬日圓','43.05m²','淺草')}`;
    const results=`<div class="result-title"><div><div class="eyebrow">SEARCH RESULTS</div><h1>符合條件的物件 <span style="color:var(--teal)">28</span> 件</h1></div><button class="filter-button">篩選條件 · 4</button></div><div class="results-layout"><aside class="filters"><h2>篩選條件 <span style="float:right;color:var(--teal);font-size:13px">清除</span></h2><div class="filter"><b>地區</b><span>台東區</span></div><div class="filter"><b>預算</b><span>3,000萬～5,000萬日圓</span></div><div class="filter"><b>物件類型</b><span>中古公寓</span></div><div class="filter"><b>格局</b><span>1LDK、2LDK</span></div><div class="filter"><b>車站與步行時間</b><span>淺草站・10分鐘內</span></div></aside><section>${row('淺草站步行3分鐘・採光1LDK','4,580萬日圓','43.05m²','淺草')}${row('上野公園旁・翻新2LDK','4,980萬日圓','52.18m²','上野')}${row('藏前・安靜巷弄的角間','3,980萬日圓','39.91m²','藏前')}<div class="pager"><button>1</button><button>2</button><button>3</button><button>下一頁 →</button></div></section></div>`;
    const detail=`<div class="crumb">物件搜尋 / 台東區 / 淺草站</div><div class="gallery"><div class="photo"></div><aside><div class="photo"></div><div class="photo"></div></aside></div><div class="detail-grid"><article class="detail"><span class="tag">中古公寓</span><h1>淺草站步行3分鐘・採光1LDK</h1><div class="price">4,580萬日圓</div><p style="color:var(--muted)">東京都台東區淺草1丁目</p><section class="summary"><div><b>格局</b>1LDK</div><div><b>專有面積</b>43.05m²</div><div><b>所在樓層</b>7樓</div><div><b>築年月</b>1983年1月</div><div><b>車站</b>淺草站步行3分</div><div><b>朝向</b>西南</div></section><section class="fact-group"><h2>物件概要</h2><table class="fact-table"><tr><th>物件編號</th><td>R5471700</td></tr><tr><th>價格</th><td>4,580萬日圓</td></tr><tr><th>所在地</th><td>東京都台東區淺草1丁目</td></tr><tr><th>交通</th><td>銀座線「淺草」站步行3分<br>都營淺草線「淺草」站步行5分</td></tr><tr><th>格局 / 專有面積</th><td>1LDK / 43.05m²（壁芯）</td></tr></table></section><section class="fact-group"><h2>建物與交易條件</h2><table class="fact-table"><tr><th>構造 / 總戶數</th><td>SRC造・47戶</td></tr><tr><th>土地權利</th><td>所有權</td></tr><tr><th>管理費 / 修繕基金</th><td>18,300日圓 / 13,700日圓（月）</td></tr><tr><th>現況 / 交屋</th><td>空屋 / 可議</td></tr><tr><th>更新日期</th><td>2026年8月23日</td></tr></table></section></article><aside class="contact-card"><h2>對這間房子有興趣嗎？</h2><p>在 LINE 上直接向我們諮詢物件詳情、看屋或貸款。</p><a class="line" href="#">使用 LINE 諮詢</a><p style="margin-top:18px">物件編號：R5471700</p></aside></div><div class="mobile-contact"><a class="line" href="#">使用 LINE 諮詢這間物件</a></div>`;
    const screen=new URLSearchParams(location.search).get('screen')||'home'; document.querySelector('[data-screen="'+screen+'"]').classList.add('active'); document.querySelector('#app').innerHTML=({home,results,detail})[screen];
  </script>
</body></html>
